name: Nadeef

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  nadeef:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build nadeef
        run: swift build -c release
      - name: Install nadeef
        run: sudo cp -f .build/release/nadeef /usr/local/bin/nadeef
      - name: Run nadeef on this repo
        id: scan
        shell: bash
        continue-on-error: true
        run: |
          set +e
          nadeef swift . \
            --roots "*Tests" \
            --log-level debug \
            --fail-on-findings \
            --output-sarif nadeef.sarif
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit "$code"
      - name: Comment PR on findings
        if: github.event_name == 'pull_request' && steps.scan.outputs.exit_code == '1'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'nadeef.sarif';
            let output;
            try {
              output = fs.readFileSync(path, 'utf8');
            } catch (e) {
              output = `Could not read ${path}: ${e}`;
            }
            const maxLen = 60000;
            const trimmed =
              output.length > maxLen
                ? output.slice(0, maxLen) + '\n\n… (truncated)'
                : output;
            const body = [
              '### Nadeef: unused objects found',
              '',
              'SARIF report from `--output-sarif` for this run:',
              '',
              '<details>',
              '<summary>nadeef.sarif</summary>',
              '',
              '```json',
              trimmed,
              '```',
              '',
              '</details>',
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
      - name: Fail if nadeef did not pass
        if: always() && steps.scan.outcome != 'skipped'
        shell: bash
        run: |
          code="${{ steps.scan.outputs.exit_code }}"
          if [ -z "$code" ]; then
            echo "Nadeef step did not report exit_code"
            exit 1
          fi
          exit "$code"
