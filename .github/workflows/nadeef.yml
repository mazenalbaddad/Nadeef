name: Nadeef

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  nadeef:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build nadeef
        run: |
          swift build -c release
          echo "NADEEF_PATH=$(swift build -c release --show-bin-path)/nadeef" >> "$GITHUB_ENV"
      - name: Run nadeef on this repo
        id: scan
        shell: bash
        continue-on-error: true
        run: |
          set +e
          "$NADEEF_PATH" swift . \
            --roots "*Tests" \
            --log-level debug \
            --output-json nadeef.json
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit "$code"
      - name: Check for nadeef.json
        id: json
        if: always() && steps.scan.outcome != 'skipped'
        shell: bash
        run: |
          if [ -f nadeef.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Detect findings from report
        id: report
        if: always() && steps.json.outputs.present == 'true'
        shell: bash
        run: |
          count=$(python3 -c "import json; print(json.load(open('nadeef.json'))['summary']['unusedCount'])")
          echo "unused_count=$count" >> "$GITHUB_OUTPUT"
          if [ "$count" -gt 0 ]; then
            echo "has_findings=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_findings=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Upload JSON artifact
        if: always() && steps.json.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: nadeef.json
          path: nadeef.json
      - name: Comment PR on findings
        if: steps.report.outputs.has_findings == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'nadeef.json';
            let report;
            try {
              report = JSON.parse(fs.readFileSync(path, 'utf8'));
            } catch (e) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: `### Nadeef: unused types\n\nCould not read or parse \`${path}\`: ${e}`,
              });
              return;
            }
            const unused = report.unused ?? [];
            // GITHUB_SERVER_URL is always set; context.server_url is not on the JS context (was undefined).
            const serverUrl =
              process.env.GITHUB_SERVER_URL || 'https://github.com';
            // Use PR head only — never context.sha: on pull_request runs that is the merge commit, not the branch.
            const headSha = context.payload.pull_request?.head?.sha;
            if (!headSha) {
              throw new Error('Expected pull_request.head.sha; cannot build source links without it.');
            }
            const repoBase = `${serverUrl}/${context.repo.owner}/${context.repo.repo}`;
            const blobUrl = (relPath, startingLine) => {
              const encoded = relPath
                .split('/')
                .map((p) => encodeURIComponent(p))
                .join('/');
              const lineHash = startingLine > 0 ? '#L' + startingLine : '';
              return `${repoBase}/blob/${headSha}/${encoded}${lineHash}`;
            };
            const escCell = (s) => String(s).replace(/\|/g, '\\|');
            const tableRows = unused.map((u) => {
              const locs = u.locations ?? [];
              let locationCell;
              if (locs.length > 0) {
                locationCell = locs
                  .map((loc) => {
                    const label =
                      loc.startingLine > 0
                        ? `${loc.path}:${loc.startingLine}`
                        : loc.path;
                    return `[\`${label}\`](${blobUrl(loc.path, loc.startingLine)})`;
                  })
                  .join(', ');
              } else {
                const paths = (u.paths ?? []).map((p) => {
                  return `[\`${p}\`](${blobUrl(p, 0)})`;
                });
                locationCell = paths.join(', ') || '—';
              }
              return `| ${escCell(u.name)} | \`${escCell(u.kind)}\` | ${locationCell} |`;
            });
            const table = [
              '| Symbol | Kind | Location |',
              '| :-- | :-- | :-- |',
              ...tableRows,
            ].join('\n');
            let output;
            try {
              output = fs.readFileSync(path, 'utf8');
            } catch (e) {
              output = `Could not read ${path}: ${e}`;
            }
            const maxLen = 60000;
            const trimmed =
              output.length > maxLen
                ? output.slice(0, maxLen) + '\n\n… (truncated)'
                : output;
            const runUrl = `${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`;
            const headLabel = headSha.substring(0, 7);
            const headTreeUrl = repoBase + '/tree/' + headSha;
            const headLink =
              '[`' + headLabel + '`](' + headTreeUrl + ')';
            const intro =
              'Unused Swift type definitions in the scan scope. PR head: ' + headLink + '.';
            const body = [
              '### Nadeef: unused types',
              '',
              intro,
              '',
              table,
              '',
              '**Report:** [workflow run](' + runUrl + ') — `nadeef.json` in artifacts.',
              '',
              '<details>',
              '<summary>Raw nadeef.json (preview)</summary>',
              '',
              '```json',
              trimmed,
              '```',
              '',
              '</details>',
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
      - name: Fail if nadeef did not pass
        if: always() && steps.scan.outcome != 'skipped'
        shell: bash
        run: |
          code="${{ steps.scan.outputs.exit_code }}"
          if [ -z "$code" ]; then
            echo "Nadeef step did not report exit_code"
            exit 1
          fi
          exit "$code"
