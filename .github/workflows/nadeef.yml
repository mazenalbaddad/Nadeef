name: Nadeef

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  security-events: write

jobs:
  nadeef:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build nadeef
        run: |
          swift build -c release
          echo "NADEEF_PATH=$(swift build -c release --show-bin-path)/nadeef" >> "$GITHUB_ENV"
      - name: Run nadeef on this repo
        id: scan
        shell: bash
        continue-on-error: true
        run: |
          set +e
          "$NADEEF_PATH" swift . \
            --roots "*Tests" \
            --log-level debug \
            --fail-on-findings \
            --output-sarif nadeef.sarif
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit "$code"
      - name: Check for nadeef.sarif
        id: sarif
        if: always() && steps.scan.outcome != 'skipped'
        shell: bash
        run: |
          if [ -f nadeef.sarif ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Upload SARIF artifact
        if: always() && steps.sarif.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: nadeef.sarif
          path: nadeef.sarif
      - name: Upload SARIF to Code Scanning
        if: always() && steps.sarif.outputs.present == 'true'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: nadeef.sarif
          category: nadeef
      - name: Comment PR on findings
        if: steps.scan.outputs.exit_code == '1'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'nadeef.sarif';
            let output;
            try {
              output = fs.readFileSync(path, 'utf8');
            } catch (e) {
              output = `Could not read ${path}: ${e}`;
            }
            const maxLen = 60000;
            const trimmed =
              output.length > maxLen
                ? output.slice(0, maxLen) + '\n\n… (truncated)'
                : output;
            const runUrl = `${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`;
            const body = [
              '### Nadeef: unused objects found',
              '',
              'Full `nadeef.sarif` is available as a workflow artifact, and was sent to **Code scanning** (Security tab) when supported for this repository.',
              '',
              `Workflow run: ${runUrl}`,
              '',
              'SARIF excerpt from `--output-sarif` (may be truncated here):',
              '',
              '<details>',
              '<summary>nadeef.sarif (preview)</summary>',
              '',
              '```json',
              trimmed,
              '```',
              '',
              '</details>',
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
      - name: Fail if nadeef did not pass
        if: always() && steps.scan.outcome != 'skipped'
        shell: bash
        run: |
          code="${{ steps.scan.outputs.exit_code }}"
          if [ -z "$code" ]; then
            echo "Nadeef step did not report exit_code"
            exit 1
          fi
          exit "$code"
