name: Nadeef

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  nadeef:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build nadeef
        run: |
          swift build -c release
          echo "NADEEF_PATH=$(swift build -c release --show-bin-path)/nadeef" >> "$GITHUB_ENV"
      - name: Run nadeef on this repo
        id: scan
        shell: bash
        continue-on-error: true
        run: |
          set +e
          "$NADEEF_PATH" swift . \
            --roots "*Tests" \
            --log-level debug \
            --output-json nadeef.json
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit "$code"
      - name: Check for nadeef.json
        id: json
        if: always() && steps.scan.outcome != 'skipped'
        shell: bash
        run: |
          if [ -f nadeef.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Detect findings from report
        id: report
        if: always() && steps.json.outputs.present == 'true'
        shell: bash
        run: |
          count=$(python3 -c "import json; print(json.load(open('nadeef.json'))['summary']['unusedCount'])")
          echo "unused_count=$count" >> "$GITHUB_OUTPUT"
          if [ "$count" -gt 0 ]; then
            echo "has_findings=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_findings=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Upload JSON artifact
        if: always() && steps.json.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: nadeef.json
          path: nadeef.json
      - name: Comment PR on findings
        if: steps.report.outputs.has_findings == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'nadeef.json';
            let report;
            try {
              report = JSON.parse(fs.readFileSync(path, 'utf8'));
            } catch (e) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: `### Nadeef: unused objects found\n\nCould not read or parse \`${path}\`: ${e}`,
              });
              return;
            }
            const unused = report.unused ?? [];
            const findingLines = unused.map((u) => {
              const paths = (u.paths ?? []).map((p) => `\`${p}\``).join(', ');
              return `- **${u.name}** (\`${u.kind}\`) — ${paths || '_no paths_'}`;
            });
            let output;
            try {
              output = fs.readFileSync(path, 'utf8');
            } catch (e) {
              output = `Could not read ${path}: ${e}`;
            }
            const maxLen = 60000;
            const trimmed =
              output.length > maxLen
                ? output.slice(0, maxLen) + '\n\n… (truncated)'
                : output;
            const runUrl = `${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`;
            const body = [
              '### Nadeef: unused objects found',
              '',
              'Findings (symbol → source file(s)):',
              '',
              ...findingLines,
              '',
              `Full machine-readable report: workflow artifact \`nadeef.json\` or [run logs](${runUrl}).`,
              '',
              '<details>',
              '<summary>Raw nadeef.json (preview)</summary>',
              '',
              '```json',
              trimmed,
              '```',
              '',
              '</details>',
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
      - name: Fail if nadeef did not pass
        if: always() && steps.scan.outcome != 'skipped'
        shell: bash
        run: |
          code="${{ steps.scan.outputs.exit_code }}"
          if [ -z "$code" ]; then
            echo "Nadeef step did not report exit_code"
            exit 1
          fi
          exit "$code"
